[project]
name = "mobsimgame-backend"
version = "0.1.0"
description = "MobSimGame backend: project save/share, provider proxies and report endpoints"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.148,<0.149",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<2.2",
  "geoalchemy2>=0.20,<0.21",
  "alembic>=1.20,<1.21",
  "httpx>=0.28,<0.29",
  "psycopg[binary]>=3.3,<3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "pip-audit>=2.9",
  "pip-licenses>=5.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]
