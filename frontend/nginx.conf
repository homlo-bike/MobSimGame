# Served by nginx:alpine; ${MOBSIM_API_UPSTREAM} is substituted at container start.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    server_tokens off;

    # Content Security Policy: scripts only from this origin; tiles/glyphs/terrain from the configured hosts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://elevation-tiles-prod.s3.amazonaws.com https://tiles.maps.eox.at https://server.arcgisonline.com; connect-src 'self' https://tiles.openfreemap.org https://elevation-tiles-prod.s3.amazonaws.com https://tiles.maps.eox.at https://server.arcgisonline.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass ${MOBSIM_API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Full example networks (e.g. a city's bus network) can take minutes on first load;
        # the API's own Overpass timeout (MOBSIM_EXAMPLES_TIMEOUT_S, 180 s) must fit inside this.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must be revalidated so a rebuilt image is picked up at once (the hashed
    # files under /assets/ change name on every build and can be cached for a year).
    # `expires` sets Cache-Control without add_header, so the security headers above still apply.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
