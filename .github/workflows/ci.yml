name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - name: Dependency vulnerabilities (production deps)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: mobsim
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mobsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobsim -d mobsim"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MOBSIM_TEST_POSTGIS_URL: postgresql+psycopg://mobsim:ci-only-password@localhost:5432/mobsim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app
      - run: pytest
      - name: Dependency vulnerabilities
        run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the external network used by docker-compose.yml
        run: docker network create public
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile dev config -q
      - name: Build images
        run: docker compose build
      - name: Start stack and check health
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/api/health | grep '"database":"ok"'
          curl -fsSI http://localhost:8080/ | grep -i content-security-policy
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
